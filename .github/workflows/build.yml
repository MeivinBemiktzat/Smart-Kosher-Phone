name: Build & Release EXE

# מתי הריצה מופעלת:
#   1. אוטומטית — בכל פעם שדוחפים tag שמתחיל ב-v
#      לדוגמה: v1.0.0
#
#   2. ידנית — דרך הכפתור "Run workflow"
#      במקרה של הרצה ידנית ייווצר Tag אוטומטי
#      עבור ה-GitHub Release.

on:
  push:
    tags:
      - "v*"

  workflow_dispatch: {}

# נדרש כדי ליצור Tags ו-Releases ולהעלות אליהם קבצים
permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Set up Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ============================================================
      # 4. Determine Release Tag
      #
      # אם ההרצה הופעלה באמצעות Tag:
      #   משתמשים ב-Tag הקיים.
      #
      # אם ההרצה הופעלה ידנית:
      #   נוצר Tag אוטומטי לפי תאריך ושעה.
      #
      # לדוגמה:
      #   v2026.08.05-2200
      # ============================================================
      - name: Determine release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
              $tag = "${{ github.ref_name }}"
              Write-Host "Workflow was triggered by existing tag: $tag"
          }
          else {
              $date = Get-Date -Format "yyyy.MM.dd-HHmm"
              $tag = "v$date"
              Write-Host "Workflow was triggered manually."
              Write-Host "Generated release tag: $tag"
          }

          "tag=$tag" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

      # ============================================================
      # 5. Build EXE with PyInstaller
      #
      # התיקון החשוב ל-Vosk:
      #
      #   --collect-all vosk
      #
      # בנוסף נשמר:
      #   --hidden-import vosk
      #
      # ונוסף גם:
      #   --hidden-import winsdk
      #
      # כפי שהיה בקובץ שה-AI שלך יצר.
      # ============================================================
      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name SmartKosherPhone `
            --add-data "app\style_light.qss;app" `
            --add-data "app\style_dark.qss;app" `
            --add-data "app\resources;app\resources" `
            --collect-all vosk `
            --hidden-import bleak `
            --hidden-import bleak.backends.winrt `
            --hidden-import bleak.backends.winrt.scanner `
            --hidden-import bleak.backends.winrt.client `
            --hidden-import winsdk `
            --hidden-import vosk `
            --hidden-import sounddevice `
            --hidden-import PyQt6.QtMultimedia `
            --hidden-import PyQt6.QtMultimediaWidgets `
            --icon app\resources\icon.ico `
            main.py

      # ============================================================
      # 6. Verify build output
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\SmartKosherPhone.exe")) {
              Write-Error "Build failed — SmartKosherPhone.exe not found in dist\"
              exit 1
          }

          Write-Host "============================================"
          Write-Host "Build succeeded!"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Build output:"
          Get-ChildItem "dist" | Format-Table Name, Length, LastWriteTime

      # ============================================================
      # 7. Upload build artifact
      #
      # הקובץ נשמר גם כ-Artifact של GitHub Actions.
      # ============================================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartKosherPhone-windows-exe
          path: dist/SmartKosherPhone.exe
          if-no-files-found: error

      # ============================================================
      # 8. Publish to GitHub Release
      #
      # במקרה של Tag קיים:
      #   משתמשים ב-Tag הקיים.
      #
      # במקרה של Run workflow:
      #   משתמשים ב-Tag שנוצר בשלב Determine release tag.
      #
      # ה-EXE מועלה ישירות ל-Release.
      # ============================================================
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SmartKosherPhone ${{ steps.release_tag.outputs.tag }}
          files: dist/SmartKosherPhone.exe
          generate_release_notes: true
          draft: false
          prerelease: false
