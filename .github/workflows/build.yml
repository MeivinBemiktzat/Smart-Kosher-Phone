name: Build & Release EXE

# מתי הריצה מופעלת:
#   1. אוטומטית — בכל פעם שדוחפים tag שמתחיל ב-v
#      לדוגמה: v1.0.0
#
#   2. ידנית — דרך הכפתור "Run workflow"
#      במקרה כזה ייווצר Tag אוטומטי לפי תאריך ושעה.
#
# דוגמאות:
#   v1.0.0
#   v1.1.0
#   v2026.08.05-2200

on:
  push:
    tags:
      - "v*"

  workflow_dispatch: {}

# הרשאות:
# contents: write מאפשר ל-Workflow:
# - ליצור Tag
# - ליצור Release
# - להעלות קבצים ל-Release
permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. הורדת קוד הפרויקט
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. התקנת Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. התקנת תלויות
      # ============================================================
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ============================================================
      # 4. קביעת Tag עבור ה-Release
      #
      # אם ההרצה הופעלה באמצעות Tag קיים:
      #     משתמשים ב-Tag הקיים.
      #
      # לדוגמה:
      #     v1.0.0
      #
      # אם ההרצה הופעלה ידנית:
      #     יוצרים Tag אוטומטי.
      #
      # לדוגמה:
      #     v2026.08.05-2200
      # ============================================================
      - name: Determine release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
              $tag = "${{ github.ref_name }}"
              Write-Host "Workflow was triggered by existing tag: $tag"
          }
          else {
              $date = Get-Date -Format "yyyy.MM.dd-HHmm"
              $tag = "v$date"
              Write-Host "Workflow was triggered manually."
              Write-Host "Generated release tag: $tag"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ============================================================
      # 5. Build של קובץ ה-EXE
      #
      # התיקון החשוב:
      #
      # --collect-all vosk
      #
      # פעולה זו גורמת ל-PyInstaller לאסוף את כל רכיבי Vosk,
      # כולל קבצים בינאריים, data ו-imports הנדרשים.
      #
      # זה פותר את הבעיה שבה Vosk חיפש:
      #
      # _MEIxxxxx\vosk
      #
      # ולא מצא את התיקייה/הקבצים הנדרשים בזמן הרצת ה-EXE.
      # ============================================================
      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name SmartKosherPhone `
            --add-data "app\style_light.qss;app" `
            --add-data "app\style_dark.qss;app" `
            --add-data "app\resources;app\resources" `
            --collect-all vosk `
            --hidden-import bleak `
            --hidden-import bleak.backends.winrt `
            --hidden-import bleak.backends.winrt.scanner `
            --hidden-import bleak.backends.winrt.client `
            --hidden-import vosk `
            --hidden-import sounddevice `
            --hidden-import PyQt6.QtMultimedia `
            --hidden-import PyQt6.QtMultimediaWidgets `
            --icon app\resources\icon.ico `
            main.py

      # ============================================================
      # 6. בדיקת Build
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\SmartKosherPhone.exe")) {
              Write-Error "Build failed — SmartKosherPhone.exe not found in dist\"
              exit 1
          }

          Write-Host "============================================"
          Write-Host "Build succeeded!"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Build output:"
          Get-ChildItem "dist" | Format-Table Name, Length, LastWriteTime

      # ============================================================
      # 7. העלאת EXE כ-Artifact
      #
      # ה-EXE נשמר גם בתוך הרצת ה-GitHub Actions.
      # ============================================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartKosherPhone-windows-exe
          path: dist/SmartKosherPhone.exe
          if-no-files-found: error

      # ============================================================
      # 8. יצירת GitHub Release והעלאת ה-EXE
      #
      # אם קיים Tag:
      #     משתמשים בו.
      #
      # אם ההרצה ידנית:
      #     משתמשים ב-Tag האוטומטי שנוצר בשלב הקודם.
      #
      # הקובץ dist/SmartKosherPhone.exe מועלה ישירות ל-Release.
      # ============================================================
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: SmartKosherPhone ${{ steps.release_tag.outputs.tag }}
          files: dist/SmartKosherPhone.exe
          generate_release_notes: true
          draft: false
          prerelease: false
