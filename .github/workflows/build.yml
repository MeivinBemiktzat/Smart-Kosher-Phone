name: Build & Release EXE

# מתי הריצה מופעלת:
#   1. אוטומטית — בכל פעם שדוחפים tag שמתחיל ב-v (למשל v1.0, v1.1)
#   2. ידנית — דרך הכפתור "Run workflow" בלשונית Actions בגיטהאב

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # נדרש כדי ליצור/לעדכן Release ולהעלות אליו קבצים

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name SmartKosherPhone `
            --add-data "app\style_light.qss;app" `
            --add-data "app\style_dark.qss;app" `
            --add-data "app\resources;app\resources" `
            --hidden-import bleak `
            --hidden-import bleak.backends.winrt `
            --hidden-import bleak.backends.winrt.scanner `
            --hidden-import bleak.backends.winrt.client `
            --hidden-import vosk `
            --hidden-import sounddevice `
            --hidden-import PyQt6.QtMultimedia `
            --hidden-import PyQt6.QtMultimediaWidgets `
            --icon app\resources\icon.ico `
            main.py

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f "dist/SmartKosherPhone.exe" ]; then
            echo "::error::Build failed — SmartKosherPhone.exe not found in dist/"
            exit 1
          fi
          echo "Build succeeded:"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartKosherPhone-windows-exe
          path: dist/SmartKosherPhone.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartKosherPhone.exe
          generate_release_notes: true
